name: Dina CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: pip install -r backend/requirements.txt
      - run: pytest -q backend/tests tests/accounting

  flutter:
    name: Flutter analyze and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true
      - name: Generate Android and Windows platform files
        working-directory: app
        run: flutter create . --platforms=android,windows --project-name dina_app
      - name: Get packages
        working-directory: app
        run: flutter pub get
      - name: Analyze
        working-directory: app
        run: flutter analyze
      - name: Test
        working-directory: app
        run: flutter test
      - name: Build Android APK
        working-directory: app
        run: flutter build apk --debug
      - name: Build Windows
        working-directory: app
        run: flutter build windows --debug


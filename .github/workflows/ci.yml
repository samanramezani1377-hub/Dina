name: Dina CI

on:
  push:
    branches: [main]
  # Run on PRs targeting feature branches too, not only main.
  pull_request:

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dina
          POSTGRES_PASSWORD: dina
          POSTGRES_DB: dina_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: '5432'
      POSTGRES_USER: dina
      POSTGRES_PASSWORD: dina
      POSTGRES_DB: dina_test
      PGPASSWORD: dina
      DATABASE_URL: postgresql://dina:dina@localhost:5432/dina_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install --upgrade pip
      - run: pip install -r backend/requirements.txt
      - name: Apply database migrations
        run: |
          set -euo pipefail
          for f in database/migrations/*.sql; do
            echo "Applying $f"
            psql -v ON_ERROR_STOP=1 \
              --host "$POSTGRES_HOST" --port "$POSTGRES_PORT" \
              --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" \
              --file "$f"
          done
      - name: Verify the audit table exists
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 \
            --host "$POSTGRES_HOST" --port "$POSTGRES_PORT" \
            --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" \
            --command "SELECT count(*) FROM audit_logs"
      - run: pytest -q backend/tests

  flutter-lint-test-apk:
    name: Flutter lint, test and Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Flutter 3.24.5 generates an Android Gradle 8.3 project.
      # Gradle 8.3 is incompatible with the runner's default Java 25.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true
          pub-cache: true
      - name: Pin Flutter's Android JDK
        run: |
          set -euo pipefail
          flutter config --jdk-dir "$JAVA_HOME"
          java -version
          flutter doctor -v
      - name: Generate Android platform files
        working-directory: app
        run: flutter create . --platforms=android --project-name dina_app
      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('app/android/**/gradle-wrapper.properties', 'app/android/**/build.gradle*', 'app/android/**/settings.gradle*', 'app/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      - name: Get packages
        working-directory: app
        run: flutter pub get
      - name: Analyze
        working-directory: app
        run: flutter analyze --fatal-infos --fatal-warnings
      - name: Test
        working-directory: app
        run: flutter test
      - name: Build Android APK
        working-directory: app
        run: flutter build apk --release
      - name: Verify APK artifact exists
        working-directory: app
        run: |
          set -euo pipefail
          apk=build/app/outputs/flutter-apk/app-release.apk
          if [ ! -f "$apk" ]; then
            echo "Expected APK was not produced at $apk" >&2
            exit 1
          fi
          ls -lh "$apk"
      - uses: actions/upload-artifact@v4
        with:
          name: dina-app-release-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

  flutter-windows:
    name: Flutter Windows build
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true
          pub-cache: true
      - name: Report detected Visual Studio installations
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          & $vswhere -format json -products * -all -utf8
      - name: Generate Windows platform files
        working-directory: app
        run: flutter create . --platforms=windows --project-name dina_app
      - name: Get packages
        working-directory: app
        run: flutter pub get
      - name: Build Windows
        working-directory: app
        run: flutter build windows --release
      - name: Package Windows application
        shell: pwsh
        working-directory: app
        run: |
          $ErrorActionPreference = 'Stop'
          $releaseDir = 'build/windows/x64/runner/Release'
          $exe = Join-Path $releaseDir 'dina_app.exe'
          if (-not (Test-Path $exe)) {
            throw "Expected Windows executable was not produced at $exe"
          }
          $zip = 'build/windows/dina-windows-x64.zip'
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path (Join-Path $releaseDir '*') -DestinationPath $zip -CompressionLevel Optimal
          if (-not (Test-Path $zip)) {
            throw "Windows ZIP package was not produced at $zip"
          }
          Get-Item $exe, $zip | Format-Table Name, Length
      - uses: actions/upload-artifact@v4
        with:
          name: dina-app-windows-x64
          path: app/build/windows/dina-windows-x64.zip
          if-no-files-found: error
          retention-days: 30

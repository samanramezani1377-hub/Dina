name: Dina persistent staging E2E

on:
  workflow_dispatch:

jobs:
  e2e:
    name: Real E2E against persistent staging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - name: Run real staging flow
        env:
          DINA_API_BASE_URL: ${{ vars.DINA_STAGING_API_URL || 'https://dina-api.onrender.com' }}
          DINA_E2E_EMAIL: ${{ vars.DINA_STAGING_E2E_EMAIL || 'dina.test@example.com' }}
          DINA_E2E_PASSWORD: ${{ secrets.DINA_STAGING_E2E_PASSWORD || 'Dina-Test-2026!' }}
        run: python scripts/e2e_staging.py

  android-apk:
    name: Installable APK for persistent staging
    needs: e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.5"
          channel: stable
          cache: true
          pub-cache: true
      - working-directory: app
        run: flutter pub get
      - working-directory: app
        env:
          API_BASE_URL: ${{ vars.DINA_STAGING_API_URL || 'https://dina-api.onrender.com' }}
        run: flutter build apk --release --dart-define=API_BASE_URL=$API_BASE_URL
      - uses: actions/upload-artifact@v4
        with:
          name: dina-staging-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

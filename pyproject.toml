[project]
name = "dina-cloudflare-worker"
version = "0.1.0"
description = "Cloudflare Workers Free adapter for the existing Dina FastAPI backend"
requires-python = ">=3.13"
dependencies = [
    "fastapi==0.136.1",
    "pydantic-settings>=2.7,<3",
    "psycopg==3.3.5",
    "argon2-cffi==23.1.0",
    "cryptography==47.0.0",
    "openpyxl==3.1.5",
]

[dependency-groups]
dev = [
    "workers-py",
    "workers-runtime-sdk",
]

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: dina
      POSTGRES_USER: dina
      POSTGRES_PASSWORD: dina_codespace
    ports:
      - "5432:5432"
    volumes:
      - dina_codespace_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dina -d dina"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  dina_codespace_pgdata:

services:
  - type: web
    name: dina-api
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt && python scripts/migrate.py
    initialDeployHook: python scripts/seed_staging.py
    startCommand: uvicorn src.main:app --app-dir backend --host 0.0.0.0 --port $PORT
    healthCheckPath: /health/ready
    envVars:
      - key: ENVIRONMENT
        value: staging
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: JWT_EXPIRE_MINUTES
        value: "60"
      - key: DATABASE_URL
        fromDatabase:
          name: dina-postgres
          property: connectionString
      - key: STAGING_SEED_ENABLED
        value: "true"
      - key: STAGING_TEST_EMAIL
        value: dina.test@example.com
      - key: STAGING_TEST_PASSWORD
        value: Dina-Test-2026!
    autoDeploy: true

databases:
  - name: dina-postgres
    plan: free
